name: Auto Trade
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run live trader
        env:
          BULLISH_API_KEY: ${{ secrets.BULLISH_API_KEY }}
          BULLISH_SECRET_KEY: ${{ secrets.BULLISH_SECRET_KEY }}
          BULLISH_ACCOUNT_ID: ${{ secrets.BULLISH_ACCOUNT_ID }}
        run: python live_trader.py
